<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CS PRO" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0c0f14" />
    <title>CS PRO — Couchsurfing Assistant</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <style>
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #0c0f14;
        color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 24px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 44px);
      }
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-csBg font-sans text-[13px] text-slate-200 antialiased min-h-screen selection:bg-csAmber/30 selection:text-amber-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
